name: Publish test badges

# Publishes the collected test count to a gist that the PROTEUS framework
# website reads for the atmodeller validation row. This is a fork-only,
# additive workflow: it does not touch the inherited ci.yml, so the fork stays
# cleanly syncable with the upstream repository.

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

jobs:
  badges:
    # Never run in the upstream repository or in other forks.
    if: github.repository == 'FormingWorlds/atmodeller'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.20"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Count collected tests
        id: count
        run: |
          set -o pipefail
          total=$(uv run pytest --collect-only -q 2>/dev/null \
            | grep -oE '[0-9]+ tests? collected' | grep -oE '^[0-9]+' | tail -n1)
          if [ -z "$total" ]; then
            echo "Could not determine the test count from pytest output." >&2
            exit 1
          fi
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "Collected $total tests"

      - name: Write badge JSON
        run: |
          mkdir -p .github/badges
          cat > .github/badges/tests-total.json <<JSON
          {"schemaVersion": 1, "label": "tests", "message": "${{ steps.count.outputs.total }}", "color": "blue"}
          JSON

      - name: Publish badge to gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          set -e
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          gist_id = "3b0d1370019572c00e2650799e81717d"
          token = os.environ.get("GIST_TOKEN", "").strip()
          if not token:
              raise RuntimeError("GIST_TOKEN is not set")

          files = {
              "tests-total.json": {
                  "content": Path(".github/badges/tests-total.json").read_text(encoding="utf-8")
              }
          }
          req = Request(
              url=f"https://api.github.com/gists/{gist_id}",
              data=json.dumps({"files": files}).encode("utf-8"),
              method="PATCH",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urlopen(req) as resp:
              if resp.status != 200:
                  raise RuntimeError(f"Failed to update gist, status={resp.status}")
          print("Gist updated")
          PY
